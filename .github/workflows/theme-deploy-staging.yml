name: Deploy Theme to Shopify Staging

# Pushes theme changes to the staging store on every commit to main.
on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'config/**'
      - 'layout/**'
      - 'locales/**'
      - 'sections/**'
      - 'snippets/**'
      - 'templates/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-deploy:
    name: Push theme to staging store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Push theme to staging
        run: |
          shopify theme push \
            --store="$SHOPIFY_FLAG_STORE" \
            --theme="$SHOPIFY_THEME_ID" \
            --allow-live
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_STAGING_THEME_ID }}
