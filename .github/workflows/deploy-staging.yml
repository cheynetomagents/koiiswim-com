name: Deploy to Shopify Staging

# Triggers on every push to main — keeps the dev app in sync with the repo.
on:
  push:
    branches:
      - main
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to staging store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy app to staging
        run: shopify app deploy --force
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
